[package]
name = "cadcraft-dwg"
description = "CADCraft DWG bridge: converts DWG to and from DXF bytes using the acadrust crate (MPL-2.0, used unmodified)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# MPL-2.0: used as an unmodified dependency only (see plan/adr/0001 and NOTICE).
# acadrust 0.6.4 already isolates its native-only deps (`memmap2`, `rayon`) behind
# `cfg(not(target_arch = "wasm32"))`, and uses `web_time` for clocks, so it builds for
# wasm32-unknown-unknown as well. DWG read/write therefore works in the web build.
acadrust = "0.6.4"
